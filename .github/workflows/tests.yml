  # Step 3: macOS Unit Tests (runs after code quality passes)
  unit-tests-macos:
    name: macOS Unit Tests
    runs-on: macos-26
    needs: [code-quality]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Build for macOS
        run: |
          echo "🔨 Building for macOS"
          make build

      - name: Run all unit tests on macOS
        run: |
          echo "🧪 Running all unit tests on macOS"
          set +e
          make test 2>&1 | tee test_output_macos.txt
          set -e

          if grep -q "TEST SUCCEEDED" test_output_macos.txt; then
            echo "✅ All macOS unit tests passed" >> $GITHUB_STEP_SUMMARY
            # Count tests from xcodebuild output
            TEST_COUNT=$(grep -E "Test Case.*passed" test_output_macos.txt | wc -l | tr -d ' ')
            echo "- Executed $TEST_COUNT tests successfully" >> $GITHUB_STEP_SUMMARY
            exit 0
          else
            echo "❌ macOS unit tests failed" >> $GITHUB_STEP_SUMMARY
            cat test_output_macos.txt
            exit 1
          fi

  # Step 4: Integration Test - CLI Binary (runs after unit tests pass)
  integration-test-cli:
    name: CLI Integration Test
    runs-on: macos-26
    needs: [unit-tests-macos]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build CLI binary
        run: |
          echo "🔨 Building secuencia CLI binary..."
          make build
          echo "✅ CLI binary built successfully" >> $GITHUB_STEP_SUMMARY

      - name: Install CLI binary
        run: |
          echo "📦 Installing secuencia to bin/..."
          make install

      - name: Verify CLI installation and help output
        run: |
          echo "🧪 Testing CLI binary with --help..."

          # Verify binary exists
          if [ ! -f bin/secuencia ]; then
            echo "❌ secuencia binary not found at bin/secuencia"
            exit 1
          fi

          # Verify binary is executable
          if [ ! -x bin/secuencia ]; then
            echo "❌ secuencia binary is not executable"
            exit 1
          fi

          # Execute --help and capture output
          HELP_OUTPUT=$(./bin/secuencia --help 2>&1)
          EXIT_CODE=$?

          # Verify exit code is 0
          if [ $EXIT_CODE -ne 0 ]; then
            echo "❌ ./bin/secuencia --help exited with code $EXIT_CODE"
            exit 1
          fi

          # Verify help output contains expected content
          if echo "$HELP_OUTPUT" | grep -q "USAGE:"; then
            echo "✅ CLI responds with help screen" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### CLI Integration Test Results" >> $GITHUB_STEP_SUMMARY
            echo "- Binary compiled successfully" >> $GITHUB_STEP_SUMMARY
            echo "- Binary installed to bin/secuencia" >> $GITHUB_STEP_SUMMARY
            echo "- Help screen displays correctly" >> $GITHUB_STEP_SUMMARY
            echo "- Exit code: 0" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ Help output does not contain expected content"
            echo "Help output:"
            echo "$HELP_OUTPUT"
            exit 1
          fi
