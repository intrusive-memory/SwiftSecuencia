  # Step 3: macOS Unit Tests (runs after code quality passes)
  unit-tests-macos:
    name: macOS Unit Tests
    runs-on: macos-26
    needs: [code-quality]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Build for macOS
        run: |
          echo "🔨 Building for macOS"
          xcodebuild build -scheme SwiftSecuencia-Package -destination 'platform=macOS'

      - name: Run FCPXML DTD validation tests
        run: |
          echo "🔍 Running FCPXML DTD validation tests..."
          set -o pipefail
          xcodebuild test \
            -scheme SwiftSecuencia-Package \
            -destination 'platform=macOS' \
            -only-testing:SwiftSecuenciaTests/FCPXMLDTDValidationTests 2>&1 | tee dtd_validation_output.txt

          if grep -q "Test Succeeded" dtd_validation_output.txt; then
            echo "✅ All FCPXML DTD validation tests passed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### DTD Validation Results" >> $GITHUB_STEP_SUMMARY
            echo "- Validates generated FCPXML against official DTD files (v1.9-v1.13)" >> $GITHUB_STEP_SUMMARY
            echo "- Ensures compliance with Apple's FCPXML specification" >> $GITHUB_STEP_SUMMARY
            echo "- Tests empty timelines, single/multi-clip, multi-lane, and various video formats" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ FCPXML DTD validation failed" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Run all unit tests on macOS
        run: |
          echo "🧪 Running all unit tests on macOS"
          set -o pipefail
          xcodebuild test \
            -scheme SwiftSecuencia-Package \
            -destination 'platform=macOS' \
            -parallel-testing-enabled NO 2>&1 | tee test_output_macos.txt

          if grep -q "Test Succeeded" test_output_macos.txt; then
            echo "✅ All macOS unit tests passed" >> $GITHUB_STEP_SUMMARY
            # Count tests from xcodebuild output
            TEST_COUNT=$(grep -E "Test Case.*passed" test_output_macos.txt | wc -l | tr -d ' ')
            echo "- Executed $TEST_COUNT tests successfully" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ macOS unit tests failed" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
