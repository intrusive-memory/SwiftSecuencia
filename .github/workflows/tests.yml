name: Tests

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Step 1: Code Quality (runs first)
  code-quality:
    name: Code Quality
    runs-on: macos-26

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint
        run: |
          echo "🔍 Running SwiftLint with strict mode..."
          swiftlint lint --strict
          echo "✅ SwiftLint passed" >> $GITHUB_STEP_SUMMARY

      - name: Verify Platform Configuration
        run: |
          echo "🔍 Verifying Package.swift platform configuration..."
          # Check for macOS < 26 (not allowed)
          if grep -E "platforms.*\.macOS\(\.v([0-9]|1[0-9]|2[0-5])\)" Package.swift; then
            echo "❌ Package.swift contains macOS version < 26"
            exit 1
          fi
          # Check for iOS < 26 (not allowed)
          if grep -E "platforms.*\.iOS\(\.v([0-9]|1[0-9]|2[0-5])\)" Package.swift; then
            echo "❌ Package.swift contains iOS version < 26"
            exit 1
          fi
          echo "✅ Platform configuration verified (macOS 26+, iOS 26+)" >> $GITHUB_STEP_SUMMARY

      - name: Check for TODOs in committed code
        shell: bash {0}
        run: |
          if git diff origin/main...HEAD 2>/dev/null | grep -E "^\+.*TODO|^\+.*FIXME"; then
            echo "⚠️  Warning: New TODOs or FIXMEs detected"
          fi

      - name: Check file sizes
        shell: bash {0}
        run: |
          find Sources -type f -name "*.swift" -size +100k -exec echo "⚠️  Large file: {}" \;

      - name: Check for print statements
        shell: bash {0}
        run: |
          if grep -r "print(" Sources/ --include="*.swift" | grep -v "// print"; then
            echo "⚠️  Warning: print() statements found in source code"
          fi

      - name: Swift build check
        run: |
          echo "🔨 Verifying Swift package builds..."
          make build
          echo "✅ Swift package builds successfully" >> $GITHUB_STEP_SUMMARY

